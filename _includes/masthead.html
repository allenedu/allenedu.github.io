<a class="allen-skip" href="#main">跳至主要内容</a>
<header class="allen-header">
  <div class="allen-header-inner">
    <a class="allen-brand" href="{{ '/' | relative_url }}" aria-label="Allen智学 首页">
      <svg class="allen-logo" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="13" fill="currentColor"/><path d="m12 31 10-20 10 20M17 23h10" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="11" r="3" fill="#b9e9bd"/></svg>
      <span class="allen-brand-text"><strong>Allen<span>智学</span></strong><small>MAKE LEARNING CLICK</small></span>
    </a>
    <nav class="allen-nav" id="allen-navigation" aria-label="主导航">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}" title="{{ link.en | escape }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <div class="allen-header-actions">
      <button class="allen-icon-button" type="button" data-theme-toggle aria-label="切换至深色模式" title="切换显示模式">
        <svg class="allen-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.1A8.3 8.3 0 0 1 9.9 4 8.3 8.3 0 1 0 20 14.1Z"/></svg>
        <svg class="allen-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      </button>
      <a class="allen-button allen-button-small allen-header-cta" href="{{ '/#resources' | relative_url }}">开始探索</a>
      <button class="allen-icon-button allen-menu-toggle" type="button" data-menu-toggle aria-controls="allen-navigation" aria-expanded="false" aria-label="展开导航菜单" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
</header>
