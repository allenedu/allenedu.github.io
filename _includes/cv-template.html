<style>
  .archive { width: 80%; margin: 0 auto; float: none; padding-right: 0; }
  @media (min-width: 80em) { .archive { width: 70%; } }
  .cv-section { margin-bottom: 40px; }
  .cv-header-info { text-align: center; margin-bottom: 30px; }
  .cv-title { margin-top: 40px; margin-bottom: 15px; font-weight: bold; }
</style>

<div class="cv-container">
  <!-- 1. 个人基础信息 -->
  <div class="cv-section cv-header-info">
    <h1>{{ cv.basics.name }}</h1>
    <div class="cv-contact">
      <span>{{ cv.basics.email }}</span> | 
      <span>微信: {{ cv.basics.phone }}</span>
    </div>
  </div>

  <!-- 2. 中文版简历 -->
  <h2 class="cv-title">中文版简历</h2>
  <div class="cv-section">
    <embed src="{{ base_path }}/files/cv-c.pdf" width="100%" height="800px" type="application/pdf">
  </div>

  <!-- 3. 英文版简历 -->
  <h2 class="cv-title">英文版简历</h2>
  <div class="cv-section">
    <embed src="{{ base_path }}/files/cv-e.pdf" width="100%" height="800px" type="application/pdf">
  </div>

  <!-- 4. 韩文版简历 -->
  <h2 class="cv-title">韩文版简历</h2>
  <div class="cv-section">
    <embed src="{{ base_path }}/files/cv-k.pdf" width="100%" height="800px" type="application/pdf">
  </div>
</div>
