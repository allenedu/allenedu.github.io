<div class="allen-lab" data-math-lab>
  <div class="allen-lab-controls"><span class="allen-lab-label">THE MATH PLAYGROUND</span><h3>一条抛物线，<br>有多少种可能？</h3><p>改变开口、移动顶点，观察二次函数的图像。</p><p class="allen-equation" data-equation aria-live="polite">y = x²</p>
    <label for="lab-a"><span>开口系数 <b>a</b></span><output for="lab-a" data-output="a">1</output></label><input id="lab-a" type="range" min="-2" max="2" step="0.25" value="1" data-parameter="a">
    <label for="lab-h"><span>水平移动 <b>h</b></span><output for="lab-h" data-output="h">0</output></label><input id="lab-h" type="range" min="-3" max="3" step="0.5" value="0" data-parameter="h">
    <label for="lab-k"><span>竖直移动 <b>k</b></span><output for="lab-k" data-output="k">0</output></label><input id="lab-k" type="range" min="-2" max="3" step="0.5" value="0" data-parameter="k">
    <button class="allen-lab-reset" type="button" data-reset-lab>恢复初始图像</button>
  </div>
  <div class="allen-lab-graph"><div class="allen-graph-top"><span>FUNCTION EXPLORER</span><span>y = a(x − h)² + k</span></div><svg viewBox="0 0 600 390" role="img" aria-labelledby="lab-graph-title lab-graph-description"><title id="lab-graph-title">二次函数图像</title><desc id="lab-graph-description">二次函数 y = x² 的图像，顶点在原点。</desc><defs><pattern id="lab-grid" width="50" height="32" x="50" y="35" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 32" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="1"/></pattern><clipPath id="lab-clip"><rect x="50" y="35" width="500" height="320"/></clipPath></defs><rect x="50" y="35" width="500" height="320" fill="url(#lab-grid)"/><path d="M50 227H550M300 35V355" stroke="currentColor" stroke-opacity=".38" stroke-width="1.2"/><g class="allen-graph-labels" fill="currentColor"><text x="562" y="232">x</text><text x="308" y="28">y</text><text x="308" y="245">0</text><text x="194" y="246">−2</text><text x="395" y="246">2</text><text x="494" y="246">4</text><text x="275" y="168">2</text><text x="275" y="104">4</text><text x="269" y="297">−2</text></g><g clip-path="url(#lab-clip)"><path data-curve d="M200 99 Q300 355 400 99" fill="none" stroke="#127568" stroke-width="3.5" stroke-linecap="round"/><circle data-vertex cx="300" cy="227" r="6" fill="#127568" stroke="white" stroke-width="3"/></g></svg><div class="allen-graph-caption"><span class="allen-graph-key" aria-hidden="true"></span><span data-lab-insight aria-live="polite">开口向上，顶点位于 (0, 0)。</span></div><a class="allen-text-link" href="{{ '/year-archive/' | relative_url }}">继续探索 Desmos</a><noscript><p>开启 JavaScript 后可拖动参数；也可以直接前往 Desmos 绘图。</p></noscript></div>
</div>
