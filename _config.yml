# Allen智学 · learning resources and interactive mathematics
locale: zh-CN
site_theme: default
title: Allen智学
title_separator: '-'
name: Allen
description: Allen智学：开放的国际数学学习空间，分享课程大纲、数学词汇、官方真题入口与实用学习工具。
url: https://allenedu.github.io
baseurl: ''
repository: allenedu/allenedu.github.io
author:
  name: Allen
  avatar: profile720bys.png
  bio: 专注国际课程数学教学，让复杂的概念变清晰，让每一次进步有迹可循。
  location: 中国·上海
  email: 3384941619@qq.com
  wechat: true
  github: allenedu
  googlescholar: https://scholar.google.com/citations?user=PS_CX0AAAAAJ
future: false
breadcrumbs: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true
include:
- _pages
- files
exclude:
- .devcontainer
- .github
- Gemfile
- Gemfile.lock
- LICENSE
- README.md
- Dockerfile
- docker-compose.yaml
- package.json
- package-lock.json
- node_modules
- vendor
- scripts
- tests
- docs
- markdown_generator
- talkmap
- talkmap.py
- talkmap.ipynb
- talkmap_out.ipynb
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- tmp
- log
encoding: utf-8
markdown: kramdown
highlighter: rouge
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
collections:
  teaching:
    output: true
  talks:
    output: true
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: learning
    author_profile: false
- scope:
    path: ''
    type: teaching
  values:
    layout: resource
    course: true
    learning_tools: true
    author_profile: false
- scope:
    path: ''
    type: talks
  values:
    layout: resource
    vocabulary: true
    learning_tools: true
    author_profile: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:title/
timezone: Asia/Shanghai
plugins:
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
whitelist:
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
