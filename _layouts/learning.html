<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }} · {{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/discussys.png' | absolute_url }}">
    <meta name="theme-color" content="#127568">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/allen-mark.svg' | relative_url }}">
    {% include allen-assets.html %}
    {% if page.math_studio %}
    <link rel="stylesheet" href="{{ '/assets/css/math-studio.css?v=studio2' | relative_url }}">
    <script type="module" src="{{ '/assets/js/math-studio.mjs?v=studio2' | relative_url }}"></script>
    {% endif %}
  </head>
  <body class="allen-site allen-modern" id="top">
    {% include masthead.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
